name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json version
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if [ "$PKG_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json ($PKG_TAG)"
            exit 1
          fi
      - run: npm ci
      - name: Test against React 18
        run: npm i --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18 && npx vitest run
      - run: npm ci
      - name: Publish (Trusted Publishing, provenance)
        # Pre-releases (2.0.0-alpha.0, 2.0.0-beta.1…) go to the "next" dist-tag, never to "latest".
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          echo "Publishing $VERSION with dist-tag $TAG"
          npm publish --tag "$TAG"
